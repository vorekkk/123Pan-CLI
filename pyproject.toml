[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pan123-cli"
version = "0.1.0"
description = "Cross-platform CLI for the official 123Pan OpenAPI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vorek", email = "vorek000@163.com" }]
keywords = ["123pan", "cloud-drive", "cli", "openapi", "file-transfer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = [
  "httpx>=0.28.1,<0.29",
  "rich>=13.9,<15",
  "platformdirs>=4.3,<5",
  "filelock>=3.16,<4",
  "python-dotenv>=1.2.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "mypy>=1.13", "build>=1.2"]

[project.scripts]
pan123 = "pan123_cli.cli:main"

[project.urls]
Homepage = "https://github.com/vorekkk/123Pan-CLI"
Repository = "https://github.com/vorekkk/123Pan-CLI"
Documentation = "https://github.com/vorekkk/123Pan-CLI/tree/main/docs"
Issues = "https://github.com/vorekkk/123Pan-CLI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/pan123_cli"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true

