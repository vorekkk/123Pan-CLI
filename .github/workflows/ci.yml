name: CLI verification

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
    inputs:
      arm:
        description: Run native Linux and Windows ARM64 checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.arm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests
      - run: python -m mypy src/pan123_cli
      - run: python -m build
      - name: Install the built wheel
        run: python scripts/check_wheel.py
      - name: Verify release metadata and artifact contents
        run: python scripts/check_release.py

  arm:
    if: github.event_name == 'workflow_dispatch' && inputs.arm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/check_wheel.py
      - run: python scripts/check_release.py
